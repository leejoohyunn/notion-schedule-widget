<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Schedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <button class="nav-btn" onclick="changeWeek(-1)">&larr;</button>
        <h1 class="week-display"></h1>
        <button class="nav-btn" onclick="changeWeek(1)">&rarr;</button>
      </div>
      <div class="header-right">
        <button class="sync-btn" id="googleAuthBtn" onclick="handleGoogleAuth()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>Google 연동</span>
        </button>
        <button class="add-btn" onclick="openModal()">+ 일정 추가</button>
      </div>
    </header>

    <div class="weekly-grid">
      <div class="time-column">
        <div class="day-header"></div>
      </div>
    </div>
  </div>

  <!-- 일정 추가/수정 모달 -->
  <div class="modal" id="scheduleModal">
    <div class="modal-content">
      <h2 id="modalTitle">일정 추가</h2>
      <form id="scheduleForm">
        <input type="hidden" id="editId">
        <input type="hidden" id="isGoogleEvent">

        <label for="title">일정 제목</label>
        <input type="text" id="title" required placeholder="예: 팀 미팅">

        <label for="dayOfWeek">요일</label>
        <select id="dayOfWeek" required>
          <option value="0">월요일</option>
          <option value="1">화요일</option>
          <option value="2">수요일</option>
          <option value="3">목요일</option>
          <option value="4">금요일</option>
          <option value="5">토요일</option>
          <option value="6">일요일</option>
        </select>

        <label for="startTime">시작 시간</label>
        <input type="time" id="startTime" required>

        <label for="endTime">종료 시간</label>
        <input type="time" id="endTime" required>

        <label for="color">색상</label>
        <div class="color-picker">
          <input type="radio" name="color" value="#4A90D9" id="c1" checked>
          <label for="c1" style="background:#4A90D9"></label>

          <input type="radio" name="color" value="#7B68EE" id="c2">
          <label for="c2" style="background:#7B68EE"></label>

          <input type="radio" name="color" value="#50C878" id="c3">
          <label for="c3" style="background:#50C878"></label>

          <input type="radio" name="color" value="#FFB347" id="c4">
          <label for="c4" style="background:#FFB347"></label>

          <input type="radio" name="color" value="#FF6B6B" id="c5">
          <label for="c5" style="background:#FF6B6B"></label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
          <button type="submit" class="btn-save">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2>Google Calendar 설정</h2>
      <p class="settings-desc">Google Cloud Console에서 발급받은 Client ID를 입력하세요.</p>

      <label for="clientId">Client ID</label>
      <input type="text" id="clientId" placeholder="xxxxx.apps.googleusercontent.com">

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeSettingsModal()">취소</button>
        <button type="button" class="btn-save" onclick="saveClientId()">저장</button>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
