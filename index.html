<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Schedule</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <button class="nav-btn" onclick="changeWeek(-1)">&larr;</button>
        <h1 class="week-display"></h1>
        <button class="nav-btn" onclick="changeWeek(1)">&rarr;</button>
      </div>
      <div class="header-right">
        <button class="sync-btn" id="authBtn" onclick="handleAuth()">
          <span>로그인</span>
        </button>
        <button class="add-btn" onclick="openModal()">+ 일정 추가</button>
      </div>
    </header>

    <div class="weekly-body">
      <div class="weekly-grid" id="weeklyGrid"></div>
    </div>
  </div>

  <!-- 일정 추가/수정 모달 -->
  <div class="modal" id="scheduleModal">
    <div class="modal-content">
      <h2 id="modalTitle">일정 추가</h2>
      <form id="scheduleForm">
        <input type="hidden" id="editId">

        <label for="title">일정 제목</label>
        <input type="text" id="title" required placeholder="예: 팀 미팅">

        <label for="dayOfWeek">요일</label>
        <select id="dayOfWeek" required>
          <option value="0">월요일</option>
          <option value="1">화요일</option>
          <option value="2">수요일</option>
          <option value="3">목요일</option>
          <option value="4">금요일</option>
          <option value="5">토요일</option>
          <option value="6">일요일</option>
        </select>

        <label for="startTime">시작 시간</label>
        <input type="time" id="startTime" required>

        <label for="endTime">종료 시간</label>
        <input type="time" id="endTime" required>

        <label for="color">색상</label>
        <div class="color-picker">
          <input type="radio" name="color" value="#D50000" id="c1">
          <label for="c1" style="background:#D50000"></label>

          <input type="radio" name="color" value="#E67C73" id="c2">
          <label for="c2" style="background:#E67C73"></label>

          <input type="radio" name="color" value="#F4511E" id="c3">
          <label for="c3" style="background:#F4511E"></label>

          <input type="radio" name="color" value="#F6BF26" id="c4">
          <label for="c4" style="background:#F6BF26"></label>

          <input type="radio" name="color" value="#33B679" id="c5">
          <label for="c5" style="background:#33B679"></label>

          <input type="radio" name="color" value="#0B8043" id="c6">
          <label for="c6" style="background:#0B8043"></label>

          <input type="radio" name="color" value="#039BE5" id="c7" checked>
          <label for="c7" style="background:#039BE5"></label>

          <input type="radio" name="color" value="#3F51B5" id="c8">
          <label for="c8" style="background:#3F51B5"></label>

          <input type="radio" name="color" value="#7986CB" id="c9">
          <label for="c9" style="background:#7986CB"></label>

          <input type="radio" name="color" value="#8E24AA" id="c10">
          <label for="c10" style="background:#8E24AA"></label>

          <input type="radio" name="color" value="#616161" id="c11">
          <label for="c11" style="background:#616161"></label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
          <button type="submit" class="btn-save">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 로그인 모달 -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <h2>로그인</h2>
      <div id="authStep1">
        <label for="authEmail">이메일</label>
        <input type="email" id="authEmail" placeholder="example@email.com">
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeAuthModal()">취소</button>
          <button type="button" class="btn-save" id="sendOtpBtn" onclick="sendOTP()">인증코드 발송</button>
        </div>
      </div>
      <div id="authStep2" style="display:none;">
        <p class="settings-desc" id="authEmailDisplay"></p>
        <label for="otpCode">인증코드</label>
        <input type="text" id="otpCode" placeholder="인증코드 입력" maxlength="10" inputmode="numeric">
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeAuthModal()">취소</button>
          <button type="button" class="btn-save" id="verifyOtpBtn" onclick="verifyOTP()">확인</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div class="modal" id="confirmModal">
    <div class="modal-content" style="max-width:320px;">
      <p class="confirm-message"></p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="resolveConfirm(false)">취소</button>
        <button class="btn-save" onclick="resolveConfirm(true)" style="background:#FF6B6B;">삭제</button>
      </div>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div id="toastContainer"></div>

  <script src="app.js?v=3"></script>
</body>
</html>
